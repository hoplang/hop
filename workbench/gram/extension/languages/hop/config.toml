name = "hop"
grammar = "hop"
path_suffixes = ["hop"]
line_comments = ["// "]
block_comment = ["<!-- ", " -->"]
tab_size = 2

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    # `<` and `>` are also the relational operators, so the pair is kept for
    # matching and surrounding but never auto-inserted.
    { start = "<", end = ">", close = false, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]

[jsx_tag_auto_close]
open_tag_node_name = "start_tag"
close_tag_node_name = "end_tag"
jsx_element_node_name = "element"
tag_name_node_name = "tag_name"
tag_name_node_name_alternates = ["component_name"]
